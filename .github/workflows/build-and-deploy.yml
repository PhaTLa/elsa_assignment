name: Build, Scan & Push

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  scan-code:
    name: SCA & SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: SonarQube Cloud Scan (PR)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Cloud Scan (Push)
        if: github.event_name == 'push'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build & Push Image
    needs: scan-code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate lowercase image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Image name: $IMAGE_NAME"

      - name: Generate image tag (git SHA)
        id: meta
        run: |
          SHA_SHORT=${{ github.sha }}
          echo "tag=${SHA_SHORT:0:8}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHA_SHORT:0:8}"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists (skip if exists)
        id: check-image
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}"
          echo "Checking if image exists: $IMAGE_FULL"

          if docker pull "$IMAGE_FULL" 2>/dev/null; then
            echo "✓ Image already exists in registry, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "✓ Image does not exist, proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        if: steps.check-image.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: steps.check-image.outputs.should_build == 'true'
        uses: sigstore/cosign-installer@v3.5.0

      # Old Trivy scan that printed a text table to logs:
      # - name: Trivy image scan (HIGH/CRITICAL only)
      #   if: steps.check-image.outputs.should_build == 'true'
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
      #     format: 'table'
      #     severity: 'HIGH,CRITICAL'
      #     exit-code: '1'

      - name: Trivy image scan (Generate cosign-vuln report)
        if: steps.check-image.outputs.should_build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
          format: 'cosign-vuln'
          output: 'vuln.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Attest vulnerability report with Cosign
        if: steps.check-image.outputs.should_build == 'true'
        run: |
          cosign attest --yes \
            --predicate vuln.json \
            --type vuln \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}

      - name: Build summary
        run: |
          if [ "${{ steps.check-image.outputs.should_build }}" = "true" ]; then
            echo "✓ Image built, scanned, and attested successfully"
          else
            echo "ℹ Image already exists in registry (SHA: ${{ steps.meta.outputs.tag }})"
            echo "  Skipped build, scan, and attestation to save time/resources"
          fi
