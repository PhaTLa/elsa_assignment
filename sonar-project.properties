# SonarQube Cloud Configuration
# Ref: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

sonar.projectKey=phatla_quote-api
sonar.organization=phatla

# Source code location
sonar.sources=app/src
sonar.exclusions=**/tests/**,**/*_test.py,**/node_modules/**

# Python-specific
sonar.python.version=3.9

# Coverage (optional, if you add tests later)
# sonar.python.coverage.reportPaths=coverage.xml

# Rules to apply
sonar.qualitygate.wait=true
